name: Self Hosted Demo
# Controls when the action will run
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

# A workflow run is made up of one or more jobs
jobs:
  say-hello:
    # The type of virtual machine runner the job will run on
    runs-on: 
      group: roboshop
      labels: [nodejs]

    # Steps represent a sequence of tasks that will be executed
    steps:
      # Step 1: Print a basic greeting
      - name: Run Hello World
        run: echo "Hello, World!"

      # Step 2: Print an environment variable
      - name: Run Custom Message
        run: echo "GitHub Actions is working perfectly!"
