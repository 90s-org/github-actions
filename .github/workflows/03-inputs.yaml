name: inputs-demo
# Controls when the action will run
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      print_tags:
        description: 'True to print to STDOUT'
        required: true
        type: boolean
      tags:
        description: 'Test scenario tags'
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

# A workflow run is made up of one or more jobs
jobs:
  say-hello:
    # The type of virtual machine runner the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed
    steps:
      # Step 1: Print a basic greeting
      - name: Run Hello World
        run: echo "Hello, World!"

      # Step 2: Print an environment variable
      - name: Run Custom Message
        run: echo "GitHub Actions is working perfectly!"
